services:
  - type: web
    name: ahsc-footy-bot
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      playwright install chromium
      playwright install-deps chromium
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: VERIFY_TOKEN
        value: ahsc_footy_bot_2025
      - key: TOURNAMENT_URL
        value: https://challenge.place/c/68e25e0e0cd837a479b79cc6
